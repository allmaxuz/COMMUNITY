<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--y:#4FBF5E;--q:#151515;--q2:#1d1d1d;--q3:#262626;--k:#8a8a8a;--r:#ff6b6b;--s:#ffcc4d;--b:#2AABEE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;background:#0d0d0d;color:#fff;font-size:14px;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><g fill='none' stroke='%234FBF5E' stroke-opacity='.07' stroke-width='6'><path d='M30 20 10 40l20 20M55 20 35 40l20 20'/><path d='M90 70 70 90l20 20M115 70 95 90l20 20'/></g></svg>");}
.top{position:sticky;top:0;z-index:5;background:rgba(13,13,13,.92);backdrop-filter:blur(8px);padding:12px 14px 8px;display:flex;align-items:center;gap:10px}
.lg{width:34px;height:34px;border-radius:10px;background:var(--y);display:flex;align-items:center;justify-content:center;color:var(--q);font-weight:900;font-size:20px;flex:none}
.top b{font-size:16px;display:block}.top small{color:var(--k);font-size:11px}
.top .orq{margin-left:auto;background:var(--q3);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-size:13px}
main{padding:0 12px 90px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:20px;background:var(--q3);color:#ddd;font-size:12.5px;border:0}
.chip.on{background:var(--y);color:var(--q);font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.k{background:var(--q2);border:1px solid #2b2b2b;border-radius:16px;padding:11px 12px}.k small{display:block;color:var(--k);font-size:11px}
.k b{font-size:22px;letter-spacing:-.5px;display:block;margin:2px 0}.k i{font-style:normal;font-size:11px;color:#bbb}
.up{color:var(--y)!important}.dn{color:var(--r)!important}.yl{color:var(--s)!important}
.kt{background:var(--q2);border:1px solid #2b2b2b;border-radius:16px;padding:12px;margin:8px 0}
.kt h4{margin:0 0 8px;font-size:14px}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #2a2a2a}.it:last-child{border:0}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.ig{background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7)}.tg{background:var(--b)}
.it .m{flex:1;min-width:0}.it .m b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .m span{color:#aaa;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .r{text-align:right;font-size:11px;color:#aaa;flex:none}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:9px}.pr{background:var(--r);color:#fff}.py{background:var(--s);color:var(--q)}.pg{background:var(--y);color:var(--q)}.pb{background:var(--b);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:12px;background:var(--y);color:var(--q);font-weight:800;font-size:14px;margin:8px 0}
.btn2{background:var(--q3);color:#fff;font-weight:600}.btn.kichik{display:inline-block;width:auto;padding:7px 12px;font-size:12.5px;margin:3px 3px 3px 0}
input,select,textarea{width:100%;background:#111;border:1px solid #333;border-radius:12px;color:#fff;padding:10px 12px;font-size:14px;font-family:inherit;margin:4px 0}
textarea{min-height:90px}
label{font-size:11.5px;color:var(--k);display:block;margin-top:6px}
.ms{max-width:82%;border-radius:16px;padding:8px 12px;margin:5px 0;font-size:13.5px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.ms small{display:block;font-size:10px;opacity:.6;margin-top:3px}
.mm{background:#262626}.mb{background:var(--y);color:var(--q);margin-left:auto}
.kun{text-align:center;font-size:11px;color:var(--k);margin:10px 0 4px}
.tab{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(10,10,10,.97);border-top:1px solid #222;padding:6px 2px 12px;z-index:9}
.tab button{flex:1;background:none;border:0;color:#8a8a8a;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab button em{font-style:normal;font-size:20px}.tab .on{color:var(--y);font-weight:700}
.ai{background:var(--y);color:var(--q)!important;border-radius:16px;margin-top:-16px;padding:6px 0;box-shadow:0 4px 14px rgba(79,191,94,.35)}
.bar{height:8px;border-radius:5px;background:var(--y);display:inline-block;vertical-align:middle;margin:0 6px}
.yuk{text-align:center;color:var(--k);padding:30px}
.xato{background:#3a1515;border:1px solid #702828;color:#ffb3b3;border-radius:12px;padding:10px;margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:20}
.modal>div{background:#181818;width:100%;border-radius:22px 22px 0 0;padding:16px;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:90%}
.tv{background:#111;border:1px solid #2b2b2b;border-radius:12px;padding:8px;margin:6px 0}
.row{display:flex;gap:6px}.row>*{flex:1}
details{background:var(--q2);border:1px solid #2b2b2b;border-radius:14px;padding:10px 12px;margin:6px 0}summary{font-weight:700}
details p{white-space:pre-wrap;color:#ccc;font-size:13px;line-height:1.5}

/* ---- Bo'lim fonlari (maket bo'yicha): f-yashil · f-qora · f-oq ---- */
body{transition:background-color .25s;background-attachment:fixed}
body.f-qora{background-color:#0d0d0d;background-image:radial-gradient(120% 60% at 85% -10%,rgba(79,191,94,.28),transparent 60%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><g fill='none' stroke='%234FBF5E' stroke-opacity='.07' stroke-width='6'><path d='M30 20 10 40l20 20M55 20 35 40l20 20'/><path d='M90 70 70 90l20 20M115 70 95 90l20 20'/></g></svg>")}
body.f-yashil{background-color:#0d0d0d;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><g fill='none' stroke='%23ffffff' stroke-opacity='.14' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'><path d='M40 250V170l70-60 70 60v80'/><path d='M230 250V120M290 250V80M350 250V150'/><path d='M250 70l50-30 50 20'/></g></svg>"),linear-gradient(180deg,#4FBF5E 0%,#3aa64a 28%,#1f6a2a 60%,#0f2a14 85%,#0d0d0d 100%);background-repeat:no-repeat;background-position:right 10px top 70px,0 0;background-size:300px auto,100% 100%}
body.f-oq{background-color:#f3f4f1;color:#151515;background-image:repeating-radial-gradient(circle at 80% 30%,transparent 0 38px,rgba(21,21,21,.045) 38px 40px)}
.f-yashil .top{background:rgba(79,191,94,.55)}.f-yashil .top small{color:rgba(255,255,255,.8)}.f-yashil .lg{background:#151515;color:var(--y)}
.f-yashil .k,.f-yashil .kt,.f-yashil details{background:rgba(13,13,13,.62);border-color:rgba(255,255,255,.08);backdrop-filter:blur(6px)}
.f-yashil .chip{background:rgba(255,255,255,.18);color:#fff}.f-yashil .chip.on{background:#fff;color:var(--q)}
.f-qora .k,.f-qora .kt,.f-qora details{background:rgba(29,29,29,.88)}
.f-oq .top{background:rgba(243,244,241,.92)}.f-oq .top small{color:#6b6b6b}.f-oq .top .orq{background:#e6e8e3;color:#151515}
.f-oq .k,.f-oq .kt,.f-oq details{background:#fff;border-color:#e6e8e3;color:#151515;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.f-oq .k small,.f-oq label{color:#777}.f-oq .k i{color:#555}
.f-oq .it{border-color:#eceee9}.f-oq .it .m span,.f-oq .it .r{color:#666}
.f-oq .chip{background:#e6e8e3;color:#333}.f-oq .chip.on{background:var(--y);color:var(--q)}
.f-oq .btn2{background:#e6e8e3;color:#151515}
.f-oq input,.f-oq select,.f-oq textarea{background:#fff;border-color:#d9dcd5;color:#151515}
.f-oq .tv{background:#f6f7f4;border-color:#e3e5df;color:#151515}
.f-oq details p{color:#444}
.f-oq [style*="color:#bbb"],.f-oq [style*="color:#ccc"],.f-oq [style*="color:#ddd"],.f-oq [style*="color:#aaa"]{color:#555!important}
.f-oq .yuk{color:#777}
.f-oq .tab{background:rgba(250,250,248,.97);border-top-color:#e3e5df}.f-oq .tab button{color:#777}.f-oq .tab .on{color:#2e8b3e}
.f-oq .modal>div{background:#fff;color:#151515}
</style></head>
<body class="f-yashil">
<div class="top"><div class="lg">«</div><div><b id="sarl">Community</b><small id="ost">yuklanmoqda…</small></div><button class="orq" id="orq" style="display:none" onclick="orqaga()">←</button></div>
<main id="ekran"><div class="yuk">⏳</div></main>
<nav class="tab" id="tab">
 <button data-t="asosiy" class="on"><em>🏠</em>Asosiy</button><button data-t="xabarlar"><em>💬</em>Xabarlar</button>
 <button data-t="dastafka"><em>📦</em>Dastafka</button><button data-t="ai"><em class="ai">🤖</em>AI</button><button data-t="koproq"><em>☰</em>Ko'proq</button>
</nav>
<script>
let INIT = '', MEN = null, SHB = null, tarix = [];
const $ = s => document.querySelector(s), E = $('#ekran');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pul = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const vaqt = ms => { const d = new Date(ms); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); };
const sana = ms => { const d = new Date(ms); return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); };
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
// Ma'lumot manzili: GitHub'da — ?api=… (bot beradi, KONTENT ilovasi bilan bir xil); Apps Script ichida — google.script.run
const GAS = !!(window.google && google.script && google.script.run);
const API_URL = (() => { const q = new URLSearchParams(location.search); let u = q.get('api') || q.get('s') || ''; try { if (u) localStorage.setItem('cm_api', u); else u = localStorage.getItem('cm_api') || ''; } catch (e) {} return u; })();
const OQISH = ['asosiy', 'chatlar', 'yozishma', 'dastafkalar', 'kommentlar', 'shablon', 'savdo', 'qongiroq', 'karta', 'tahlil', 'javobTezligi', 'qayta', 'eslatmalar', 'tayyor', 'jamoa', 'tizim', 'qidir', 'reklama'];
function api(m, a) {
  const e = EKRAN, p = apiXom(m, a);
  if (OQISH.indexOf(m) < 0) return p;                          // yozish so'rovlari — har doim oxirigacha
  const kut = () => new Promise(() => {});                     // ekran almashgan — jim tashlanadi
  return p.then(r => e === EKRAN ? r : kut(), x => { if (e === EKRAN) throw x; return kut(); });
}
function apiXom(m, a) {
  if (GAS && JIM) a = Object.assign({}, a, { jim: 1 });
  if (GAS) return new Promise((ok, no) => google.script.run.withSuccessHandler(s => { const j = JSON.parse(s); j.ok ? ok(j.r) : no(new Error(j.xato)); }).withFailureHandler(e => no(e)).api(INIT, m, a || {}));
  if (JIM) a = Object.assign({}, a, { jim: 1 });
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ init: INIT, metod: m, a: a || {} }) })   // text/plain — CORS so'rovisiz
    .then(r => { if (!r.ok) throw new Error('Server javob bermadi (' + r.status + ')'); return r.json(); })
    .then(j => { if (!j.ok) throw new Error(j.xato); return j.r; })
    .catch(e => { throw new Error(/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? "Internet yoki server bilan aloqa yo'q — qayta urinib ko'ring" : e.message); });
}
function xato(e) { E.insertAdjacentHTML('afterbegin', '<div class="xato">❌ ' + esc(e.message || e) + '</div>'); }
let JIM = false;                                               // jim yangilanish: «yuklanmoqda» ko'rsatilmaydi
function yuk() { if (!JIM) E.innerHTML = '<div class="yuk">⏳ yuklanmoqda…</div>'; }
// Ochiq ekran (Asosiy, Xabarlar, yozishma) har 15 soniyada o'zi yangilanadi. Ilova yopiq/fon'da, oyna ochiq yoki yozayotganda — yangilanmaydi
const YANGILASH_SON = 15;
setInterval(() => {
  if (document.hidden || JIM || document.querySelector('.modal')) return;
  const f = document.activeElement; if (f && /INPUT|TEXTAREA|SELECT/.test(f.tagName)) return;
  const t = tarix[tarix.length - 1]; if (!t || [asosiy, xabarlar, yozishma].indexOf(t[0]) < 0) return;
  const y = window.scrollY, pastda = window.innerHeight + y >= document.body.scrollHeight - 40;
  const e = EKRAN; JIM = true;
  Promise.resolve(t[0](...t[1])).catch(() => {}).finally(() => { if (e !== EKRAN) return; JIM = false; window.scrollTo(0, t[0] === yozishma && pastda ? document.body.scrollHeight : y); });
}, YANGILASH_SON * 1000);
function sarl(a, b) { $('#sarl').textContent = a; $('#ost').textContent = b || ''; }
function fon(n) { if (!JIM) document.body.className = 'f-' + n; }
let EKRAN = 0;                                                 // har yangi ekranda +1: eski ekranning kech kelgan javobi tashlanadi
function bet(fn, ...a) { EKRAN++; JIM = false; fon('qora'); tarix.push([fn, a]); $('#orq').style.display = tarix.length > 1 ? '' : 'none'; window.scrollTo(0, 0); fn(...a); }
function orqaga() { tarix.pop(); const x = tarix.pop(); if (x) bet(x[0], ...x[1]); }
function tabla(t) { document.querySelectorAll('.tab button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); tarix = []; bet({ asosiy, xabarlar, dastafka, ai: aiBet, koproq }[t]); }
document.querySelectorAll('.tab button').forEach(b => b.onclick = () => tabla(b.dataset.t));
function modal(html) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div>' + html + '</div>'; m.onclick = e => { if (e.target === m) m.remove(); }; document.body.appendChild(m); return m; }
function soraMatn(savol, variant) {
  return new Promise(ok => {
    const m = modal('<b>' + esc(savol) + '</b>' + variant.map(v => '<div class="tv" data-v="' + esc(v) + '">' + esc(v) + '</div>').join('') + '<input id="sm"><button class="btn" id="smok">OK</button>');
    m.querySelectorAll('.tv').forEach(d => d.onclick = () => { m.querySelector('#sm').value = d.dataset.v; });
    m.querySelector('#smok').onclick = () => { const v = m.querySelector('#sm').value.trim(); m.remove(); ok(v); };
  });
}
function tasdiq(matn) { return new Promise(ok => { const m = modal('<p style="white-space:pre-wrap">' + esc(matn) + '</p><button class="btn" id="ha">✅ Ha</button><button class="btn btn2" id="yoq">❌ Bekor</button>'); m.querySelector('#ha').onclick = () => { m.remove(); ok(true); }; m.querySelector('#yoq').onclick = () => { m.remove(); ok(false); }; }); }
const ozg = x => x == null ? '' : (x >= 0 ? '<span class="up">▲ ' + x + '%</span>' : '<span class="dn">▼ ' + Math.abs(x) + '%</span>');
const chipq = (l, on, fn) => '<div class="chips">' + l.map(([k, t]) => '<button class="chip' + (k === on ? ' on' : '') + '" onclick="' + fn + '(\'' + k + '\')">' + t + '</button>').join('') + '</div>';

// ---------------- 🏠 Asosiy ----------------
let DAVR = 'bugun';
async function asosiy(d) {
  DAVR = d || DAVR; fon('yashil'); sarl('Community', MEN ? MEN.ism + ' · ' + MEN.rol : ''); yuk();
  try {
    const r = await api('asosiy', { davr: DAVR });
    E.innerHTML = chipq([['bugun', 'Bugun'], ['kecha', 'Kecha'], ['7kun', '7 kun'], ['oy', 'Oy'], ['otgan_oy', "O'tgan oy"]], DAVR, 'asosiy') +
      '<div class="g2">' +
      k('📸 Instagram', r.ig, ozg(r.ozgarish.ig)) + k('✈️ Telegram', r.tg, ozg(r.ozgarish.tg)) +
      k('📦 Dastafka', r.dastafka, pul(r.summa) + " so'm " + ozg(r.ozgarish.dastafka)) + k('🎯 Target', r.target, '1 SMS ' + (r.smsNarx ?? '—') + ' $') +
      k('⏳ Javob', r.javobOrt == null ? '—' : r.javobOrt + ' daq', '🔴 kech: ' + r.kech) + k('🗨 Komment', r.komment, 'botdan javob: ' + r.kommentBot) +
      k("📞 Qo'ng'iroq", r.qongiroq, 'javobsiz: ' + r.javobsizQ) + k('↩️ Qaytdi', r.qaytdi, r.qaytFoiz == null ? '' : r.qaytFoiz + '%') + '</div>' +
      '<div class="kt"><h4>⏳ Hozir javob kutyapti: ' + r.javobsizHozir + '</h4>' + (r.javobsizlar.map(chatQator).join('') || '<span style="color:#888">✅ hech kim</span>') + '</div>';
  } catch (e) { E.innerHTML = ''; xato(e); }
}
const k = (a, b, c) => '<div class="k"><small>' + a + '</small><b>' + b + '</b><i>' + (c || '') + '</i></div>';

// ---------------- 💬 Xabarlar ----------------
let XF = 'hammasi', XQ = '';
function chatQator(c) {
  const j = c.javobsiz ? '<span class="pill ' + (c.javobsiz.ogoh === 'qizil' ? 'pr' : 'py') + '">' + c.javobsiz.daq + ' daq</span>' : '';
  return '<div class="it" onclick="bet(yozishma,' + esc(JSON.stringify(c.kanal)) + ',' + esc(JSON.stringify(c.conv)) + ',' + esc(JSON.stringify(c.mijoz)) + ')"><div class="av ' + (c.kanal === 'Instagram' ? 'ig' : 'tg') + '">' + esc((c.mijoz || '?')[0].toUpperCase()) + '</div>' +
    '<div class="m"><b>' + esc(c.mijoz) + '</b><span>' + (c.kim === 'Biz' ? '🏪 ' : '') + esc(c.matn) + '</span></div><div class="r">' + sana(c.ms) + ' ' + vaqt(c.ms) + '<br>' + j + '</div></div>';
}
async function xabarlar(f) {
  XF = f || XF; fon('qora'); sarl('Xabarlar', 'Instagram + Telegram');
  if (XF === 'komment') return kommentlar();
  E.innerHTML = '<input id="xq" placeholder="🔎 Nik, ism yoki telefon" value="' + esc(XQ) + '">' +
    chipq([['hammasi', 'Hammasi'], ['ig', '📸 IG'], ['tg', '✈️ TG'], ['javobsiz', '⏳ Javobsiz'], ['komment', '🗨 Komment']], XF, 'xabarlar') + '<div id="xl" class="kt"><div class="yuk">⏳</div></div>';
  $('#xq').onchange = e => { XQ = e.target.value; xabarlar(); };
  try { const r = await api('chatlar', { filtr: XF, q: XQ }); $('#xl').innerHTML = (r.royxat.map(chatQator).join('') || '<span style="color:#888">Topilmadi</span>') + '<div style="color:#777;font-size:11px;margin-top:6px">' + r.jami + ' ta suhbat</div>'; }
  catch (e) { xato(e); }
}
async function yozishma(kanal, conv, mijoz) {
  sarl(mijoz, kanal); yuk();
  try {
    const r = await api('yozishma', { kanal, conv });
    let kun = '', h = '';
    r.xabarlar.forEach(m => {
      const s = sana(m.ms); if (s !== kun) { kun = s; h += '<div class="kun">' + s + '</div>'; }
      const ovoz = m.ovoz ? '\n' + (m.turi === 'rasm' ? '📷 ' : '🎤 ') + m.ovoz : (!m.matn && m.turi && m.turi !== 'matn' ? '[' + m.turi + ']' : '');
      h += '<div class="ms ' + (m.kim === 'Biz' ? 'mb' : 'mm') + '">' + esc(m.matn) + esc(ovoz) + '<small>' + vaqt(m.ms) + (m.kim === 'Biz' ? ' · 🏪 Biz' : '') + '</small></div>';
    });
    E.innerHTML = (h || '<div class="yuk">Xabar topilmadi</div>') +
      '<div class="row" style="position:sticky;bottom:80px"><button class="btn" onclick="tabla(\'dastafka\')">📦 Dastafka</button><button class="btn btn2" onclick="bet(karta,' + esc(JSON.stringify(mijoz.split(' @')[0])) + ')">👤 Karta</button><button class="btn btn2" onclick="aiSor(' + esc(JSON.stringify(mijoz + ' ga nima deb javob yozay? Yozishmasini o\'qib taklif ber.')) + ')">🤖 Nima deb yozay</button></div>';
    window.scrollTo(0, document.body.scrollHeight);
  } catch (e) { E.innerHTML = ''; xato(e); }
}

// ---------------- 🗨 Kommentlar ----------------
let KM = [];
async function kommentlar() {
  fon('oq');
  E.innerHTML = chipq([['hammasi', 'Hammasi'], ['ig', '📸 IG'], ['tg', '✈️ TG'], ['javobsiz', '⏳ Javobsiz'], ['komment', '🗨 Komment']], 'komment', 'xabarlar') + '<div id="kl"><div class="yuk">⏳ Instagram\'da tekshirilmoqda…</div></div>';
  try {
    const r = await api('kommentlar'); KM = r.royxat; window.TJ = r.tayyor;

// ---------------- Boshlash ----------------
// Telegram initData'ni #tgWebAppData=… dan ajratib oladi. Google manzilni dekod qilib bergan bo'lsa ham ishlaydi:
// tgWebAppData'dan keyin Telegram'ning o'z parametrlari (&tgWebAppVersion=… va h.k.) gacha bo'lgan hamma qism olinadi.
function tgInit_(h) {
  h = String(h || '').replace(/^#/, '');
  const i = h.indexOf('tgWebAppData=');
  if (i < 0) return '';
  let s = h.slice(i + 13);
  const j = s.search(/&tgWebApp[A-Za-z]*=/);
  if (j >= 0) s = s.slice(0, j);
  if (s.indexOf('&') < 0 && /%26|%3D/i.test(s)) { try { s = decodeURIComponent(s); } catch (e) {} }   // kodlangan holatda — bir marta ochiladi
  return s;
}
function boshla() {
  const ol = loc => {
    const h = (loc && loc.hash) || '', p = (loc && loc.parameter) || {};
    const W = window.Telegram && Telegram.WebApp;
    if (W) { try { W.ready(); W.expand(); W.setHeaderColor && W.setHeaderColor('#0d0d0d'); W.setBackgroundColor && W.setBackgroundColor('#0d0d0d'); } catch (e) {} }
    INIT = (W && W.initData) || tgInit_(h) || tgInit_(location.hash) || p.tgWebAppData || '';
    if (!GAS && !API_URL) { E.innerHTML = '<div class="xato">Ilovani botdagi «📱 Ilova» tugmasidan oching.</div>'; $('#ost').textContent = ''; return; }
    if (!INIT) { E.innerHTML = '<div class="xato">Ilovani Telegram\'dagi «ALLMAX Community» botidan oching (📱 Ilova tugmasi).</div>'; $('#ost').textContent = ''; return; }
    if (!/(^|&)hash=/.test(INIT)) {   // tashxis: qaysi maydonlar keldi (qiymatlarsiz)
      E.innerHTML = '<div class="xato">Telegram imzosi kelmadi. Kelgan maydonlar: ' + esc(INIT.split('&').map(x => x.split('=')[0]).join(', ')) + '</div>'; $('#ost').textContent = ''; return;
    }
    api('men').then(m => { MEN = m; tabla('asosiy'); }).catch(e => { E.innerHTML = ''; xato(e); $('#ost').textContent = ''; });
  };
  if (window.google && google.script && google.script.url) google.script.url.getLocation(ol); else ol({ hash: location.hash });
}
boshla();
